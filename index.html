<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2019"><title>Magic Square</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap');
:root{color-scheme:dark;font-family:Nunito,system-ui,sans-serif;color:#e9dfc6;background:#0b1c18}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -20%,#40533d,transparent 60%),#0b1c18}
main{max-width:420px;margin:auto;padding:35px 20px 50px;text-align:center}
.eyebrow{font-size:10px;letter-spacing:.24em;color:#c8b78c}h1{font:500 52px/1.1 'Cormorant Garamond',Georgia,serif;margin:13px 0 8px;color:#f3dfb7}header p{font-size:12px;line-height:1.6;color:#b5bdad;max-width:300px;margin:0 auto 25px}
.stats{display:flex;justify-content:center;gap:65px;margin-bottom:17px}.stats div{display:grid;gap:2px}.stats small,.target small{font-size:9px;letter-spacing:.12em;color:#c4b68d}.stats strong{font:500 29px 'Cormorant Garamond',Georgia,serif;color:#f6e3b9}
.panel{border:1px solid #8c8d694f;border-radius:25px;background:radial-gradient(ellipse at top left,#b7c99616,transparent 75%),#11251f;overflow:hidden;box-shadow:0 22px 55px #0005}
.preview{min-height:335px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}.preview small{font-size:11px;letter-spacing:.18em;color:#d3bd8d}.preview>div{font:500 100px/1 'Cormorant Garamond',Georgia,serif;color:#f4dca7}.primary{background:#d6c092;color:#1d3025;border:0;border-radius:24px;padding:12px 38px;font-weight:700;cursor:pointer}
#game{padding:22px 26px 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cell{aspect-ratio:1;min-width:0;border:1px solid #d3c8a74d;border-radius:12px;background:#2b4439;color:#fae6bb;font:500 clamp(26px,8vw,36px) 'Cormorant Garamond',Georgia,serif;box-shadow:0 4px 0 #081e17;cursor:pointer;touch-action:none}.cell.given{background:#142b24;color:#b2bd9e;border-style:dashed;cursor:default}.cell.selected,.cell.over{outline:2px solid #ffe1a3;outline-offset:2px;background:#4b5540}.cell.match{border:2px solid #a4d48a;background:#304b38;box-shadow:0 0 10px #a4d48a40}.cell.fail{border:2px dashed #eda18d;background:#493a31;box-shadow:0 0 10px #eda18d30}.grid.solved .cell{border:2px solid #c3e8a8;background:#36533d;box-shadow:0 0 16px #bde99b55;animation:win 1.8s ease-out}@keyframes win{40%{box-shadow:0 0 30px #c9f5a999}100%{box-shadow:0 0 16px #bde99b55}}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #d5c49b30;background:#0d211a55}.target{display:flex;align-items:center;gap:8px}.target b{font:500 30px 'Cormorant Garamond',Georgia,serif;color:#f4dca7}.actions{display:flex;align-items:center;gap:7px}select,#restart{background:#172e27;color:#ead9b4;border:1px solid #d3c8a74d;min-height:43px;border-radius:22px}select{padding:8px;font:11px Nunito,sans-serif;max-width:117px}#restart{width:43px;font-size:26px;cursor:pointer}
.tray{display:grid;grid-template-columns:repeat(5,48px);justify-content:center;gap:9px;margin:22px auto 10px;min-height:115px}.tile{width:48px;height:48px;border:1px solid #ddcca4;border-radius:11px;background:linear-gradient(145deg,#ead9b4,#c5ab7f);color:#273b2d;font:600 26px 'Cormorant Garamond',Georgia,serif;box-shadow:0 4px 0 #826d4e;cursor:grab;touch-action:none}.tile:disabled{opacity:.17;box-shadow:none}.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%)}
#status{min-height:20px;font-size:13px;color:#c7d8b0}.hint{font-size:11px;color:#8fa194;line-height:1.7;max-width:320px;margin:18px auto}
@media(max-width:370px){main{padding:20px 12px}.tray{grid-template-columns:repeat(5,43px);gap:7px}.tile{width:43px;height:43px}#game{padding:18px}.grid{gap:6px}}@media(prefers-reduced-motion:reduce){.grid.solved .cell{animation:none}}
</style></head><body>
<main><header><h1>Magic Square</h1><p>Every row, column, and diagonal must add up to the same number.</p></header>
<section class="stats"><div><small>TIME</small><strong id="time">0:00</strong></div><div><small>BEST TIME</small><strong id="best">—</strong></div></section>
<section class="panel"><div id="preview" class="preview"><small id="previewLabel">YOUR MAGIC SUM</small><div id="previewNum">15</div><button id="begin" class="primary">Begin</button></div><div id="game" hidden><div id="grid" class="grid" aria-label="Magic square"></div></div>
<footer><div class="target"><small>EVERY LINE</small><b id="target">15</b></div><div class="actions"><select id="difficulty" aria-label="Difficulty"><option value="gentle">1 · Gentle</option><option value="glowing">2 · Glowing</option><option value="midnight">3 · Midnight</option></select><button id="restart" title="New puzzle" aria-label="New puzzle">↻</button></div></footer></section>
<div id="tray" class="tray" aria-label="Number tiles"></div><p id="status" role="status"></p>
</main>
<script>
"use strict";
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],KEY="magic-square-static-v1",BEST="magic-square-static-best-v1";
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state,phase="preview",selected=null,started=0,elapsed=0,timer=null,drag=null,ignoreClick=false,bests={};
function make(d){const base=[8,1,6,3,5,7,4,9,2],turns=Math.floor(Math.random()*4),mirror=Math.random()<.5,offset=Math.floor(Math.random()*5),scale=d==="midnight"?2:1;const solution=Array.from({length:9},(_,i)=>{let r=Math.floor(i/3),c=i%3;if(mirror)c=2-c;for(let j=0;j<turns;j++)[r,c]=[c,2-r];return base[r*3+c]*scale+offset});const fixed=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,d==="gentle"?3:d==="glowing"?2:0);const givens=solution.map((n,i)=>fixed.includes(i)?n:null);return {difficulty:d,target:15*scale+3*offset,solution,givens,tiles:shuffle(solution.filter((n,i)=>givens[i]===null)),board:[...givens]}}
function sums(){return L.map(line=>line.reduce((s,i)=>s+(state.board[i]||0),0))}
function full(){return state.board.every(n=>n!==null)}
function solved(){return full()&&sums().every(n=>n===state.target)&&state.board.every((n,i)=>state.givens[i]===null||n===state.givens[i])&&[...state.board].sort((a,b)=>a-b).join()===[...state.solution].sort((a,b)=>a-b).join()}
function valid(s){if(!s||!["gentle","glowing","midnight"].includes(s.difficulty)||!["solution","givens","tiles","board"].every(k=>Array.isArray(s[k]))||s.solution.length!==9||s.givens.length!==9||s.board.length!==9||new Set(s.solution).size!==9||!s.solution.every(n=>Number.isSafeInteger(n)&&n>0&&n<100)||!Number.isSafeInteger(s.target))return false;if(!L.every(line=>line.reduce((t,i)=>t+s.solution[i],0)===s.target)||!s.givens.every((n,i)=>n===null||n===s.solution[i])||!s.board.every((n,i)=>(n===null||s.solution.includes(n))&&(s.givens[i]===null||n===s.givens[i])))return false;const used=s.board.filter(n=>n!==null);return new Set(used).size===used.length&&[...s.tiles].sort((a,b)=>a-b).join()===s.solution.filter((n,i)=>s.givens[i]===null).sort((a,b)=>a-b).join()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,elapsed}));localStorage.setItem(BEST,JSON.stringify(bests))}catch{}}
function format(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function tick(){elapsed=Math.max(elapsed,Date.now()-started);$("time").textContent=format(elapsed);save()}
function stop(){clearInterval(timer);timer=null}
function begin(){if(phase!=="preview")return;phase="countdown";$("begin").hidden=true;$("previewLabel").textContent="GET READY";let n=3;$("previewNum").textContent=n;const step=()=>{if(phase!=="countdown")return;if(--n>0){$("previewNum").textContent=n;setTimeout(step,1000)}else{phase="playing";started=Date.now()-elapsed;timer=setInterval(tick,250);render()}};setTimeout(step,1000)}
function reset(d){stop();state=make(d);elapsed=0;selected=state.board.findIndex(n=>n===null);phase="preview";save();render()}
function move(value,target){if(phase!=="playing"||!state.tiles.includes(value)||solved()||target!==null&&(target<0||target>8||state.givens[target]!==null))return;const src=state.board.indexOf(value);if(src===target)return;if(src>=0)state.board[src]=target===null?null:state.board[target];if(target!==null)state.board[target]=value;afterMove()}
function remove(i){if(phase!=="playing"||state.givens[i]!==null)return;state.board[i]=null;afterMove()}
function afterMove(){if(solved()){tick();stop();phase="complete";if(!bests[state.difficulty]||elapsed<bests[state.difficulty])bests[state.difficulty]=elapsed}save();render()}
function render(){const active=phase==="playing"||phase==="complete";$("preview").hidden=active;$("game").hidden=!active;$("tray").hidden=!active;$("difficulty").value=state.difficulty;$("difficulty").disabled=phase==="countdown";$("restart").disabled=phase==="countdown";$("target").textContent=state.target;$("previewNum").textContent=state.target;$("previewLabel").textContent="YOUR MAGIC SUM";$("begin").hidden=false;$("begin").textContent=elapsed?"Resume":"Begin";$("time").textContent=format(elapsed);$("best").textContent=bests[state.difficulty]?format(bests[state.difficulty]):"—";$("grid").replaceChildren();$("grid").className="grid"+(phase==="complete"?" solved":"");const feedback=full()?sums().map(n=>n===state.target):null;
state.board.forEach((value,i)=>{const b=document.createElement("button");b.className="cell"+(state.givens[i]!==null?" given":"")+(selected===i&&phase==="playing"?" selected":"");if(feedback)b.className+=L.some((line,j)=>line.includes(i)&&!feedback[j])?" fail":" match";b.textContent=value??"";b.dataset.index=i;b.setAttribute("aria-label","Row "+(Math.floor(i/3)+1)+", column "+(i%3+1)+": "+(value??"empty")+(state.givens[i]!==null?", fixed clue":""));b.disabled=phase!=="playing";b.onclick=()=>{if(ignoreClick)return;if(state.givens[i]!==null)return;if(selected===i&&value!==null)remove(i);else{selected=i;render()}};if(value!==null&&state.givens[i]===null)b.onpointerdown=e=>startDrag(e,value);$("grid").append(b)});
$("tray").replaceChildren();state.tiles.forEach(n=>{const b=document.createElement("button");b.className="tile";b.textContent=n;b.disabled=state.board.includes(n)||phase!=="playing";b.onclick=()=>{if(ignoreClick)return;if(selected!==null&&state.givens[selected]===null)move(n,selected)};b.onpointerdown=e=>startDrag(e,n);$("tray").append(b)});
$("status").textContent=phase==="complete"?"Perfectly balanced! Completed in "+format(elapsed)+".":full()?feedback.filter(Boolean).length+" of 8 lines match.":""}
function startDrag(e,value){if(e.button!==0||phase!=="playing")return;drag={value,originX:e.clientX,originY:e.clientY,active:false,id:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=dragMove;e.currentTarget.onpointerup=dragEnd;e.currentTarget.onpointercancel=dragCancel}
function dragMove(e){if(!drag||e.pointerId!==drag.id)return;if(Math.hypot(e.clientX-drag.originX,e.clientY-drag.originY)>7)drag.active=true;if(!drag.active)return;e.preventDefault();let g=$("ghost");if(!g){g=document.createElement("div");g.id="ghost";g.className="tile ghost";g.textContent=drag.value;document.body.append(g)}g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"}
function dragCancel(){drag=null;$("ghost")?.remove()}
function dragEnd(e){if(!drag)return;const d=drag;dragCancel();if(!d.active)return;ignoreClick=true;setTimeout(()=>ignoreClick=false,100);const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell");if(hit){const i=Number(hit.dataset.index);if(state.givens[i]===null){selected=i;move(d.value,i)}}else{const r=$("grid").getBoundingClientRect();if(!(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom))move(d.value,null)}}
$("begin").onclick=begin;$("restart").onclick=()=>reset(state.difficulty);$("difficulty").onchange=e=>reset(e.target.value);document.addEventListener("visibilitychange",()=>{if(document.hidden&&phase==="countdown"){phase="preview";render()}});
try{bests=JSON.parse(localStorage.getItem(BEST)||"{}")||{};const old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&valid(old.state)){state=old.state;elapsed=Number.isSafeInteger(old.elapsed)&&old.elapsed>=0?old.elapsed:0}else state=make("gentle")}catch{state=make("gentle");bests={}}selected=state.board.findIndex(n=>n===null);phase=solved()?"complete":"preview";render();
</script></body></html>
